[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cocoapdf"
version = "0.1.0"
description = "CocoaPDF: deterministic PDF-to-Markdown/HTML conversion for structured text-layer PDFs. No OCR. No AI."
readme = "README.md"
authors = [{ name = "Sayantan Dey" }]
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []
keywords = ["pdf", "markdown", "html", "conversion", "document-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/sayantandey/CocoaPDF"
Repository = "https://github.com/sayantandey/CocoaPDF"
Issues = "https://github.com/sayantandey/CocoaPDF/issues"
Releases = "https://github.com/sayantandey/CocoaPDF/releases"

[project.scripts]
cocoapdf = "cocoapdf.cli:main"

[project.optional-dependencies]
build = ["pyinstaller==6.21.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["cocoapdf", "cocoapdf.*"]
