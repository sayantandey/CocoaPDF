name: Publish Python package to PyPI

on:
  workflow_run:
    workflows: ["CI and release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    name: Build exact released source
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the exact successful release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
          cache: pip

      - name: Authenticate the exact tag and GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${HEAD_SHA}" ]]
          git fetch --force --tags origin
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${HEAD_SHA}" origin/main

          release_tags=()
          while IFS= read -r tag; do
            [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || continue
            if [[ "$(git rev-parse "${tag}^{commit}")" == "${HEAD_SHA}" ]]; then
              release_tags+=("${tag}")
            fi
          done < <(git tag --list 'v*')
          [[ "${#release_tags[@]}" -eq 1 ]]

          tag="${release_tags[0]}"
          version="${tag#v}"
          release_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"
          RELEASE_JSON="${release_json}" TAG="${tag}" python - <<'PY'
          import json
          import os

          release = json.loads(os.environ["RELEASE_JSON"])
          assert release["tag_name"] == os.environ["TAG"]
          assert release["draft"] is False
          assert release["prerelease"] is False
          PY

          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"

      - name: Build wheel and source distribution
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "setuptools==84.0.0"
          rm -rf build dist src/*.egg-info
          python scripts/stamp_version.py "${VERSION}"
          export PYTHONHASHSEED=0
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${HEAD_SHA}")"
          python - <<'PY'
          from pathlib import Path
          from setuptools import build_meta

          output = Path("dist").resolve()
          output.mkdir(parents=True, exist_ok=False)
          wheel = build_meta.build_wheel(str(output))
          sdist = build_meta.build_sdist(str(output))
          print("built", wheel)
          print("built", sdist)
          PY
          python scripts/verify_pypi_artifacts.py local \
            --root . \
            --dist dist \
            --version "${VERSION}" \
            --summary "${RUNNER_TEMP}/pypi-build-summary.json"

      - name: Upload the verified Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cocoapdf-pypi-${{ steps.release.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Verify wheel / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out the exact released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download the exact distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cocoapdf-pypi-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify, install, and exercise the wheel
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_pypi_artifacts.py local \
            --root . \
            --dist dist \
            --version "${VERSION}"
          python -m pip install --disable-pip-version-check \
            --no-index \
            --no-deps \
            --force-reinstall \
            dist/*.whl
          [[ "$(cocoapdf --version)" == "cocoapdf ${VERSION}" ]]
          VERSION="${VERSION}" python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          import cocoapdf
          from cocoapdf import convert_file

          version = os.environ["VERSION"]
          assert importlib.metadata.version("cocoapdf") == version
          assert cocoapdf.__version__ == version
          root = Path.cwd()
          actual = convert_file(root / "examples/cases/tagged_semantics/input.pdf").markdown
          expected = (root / "examples/cases/tagged_semantics/full/output.md").read_text(
              encoding="utf-8"
          )
          assert actual == expected
          PY

  publish:
    name: Publish and verify on PyPI
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up verification Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Download the verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cocoapdf-pypi-${{ needs.build.outputs.version }}
          path: dist

      - name: Revalidate the publication payload
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python scripts/verify_pypi_artifacts.py local
          --root .
          --dist dist
          --version "${VERSION}"

      - name: Install the hash-pinned uv publisher
        shell: bash
        run: |
          set -euo pipefail
          requirements="${RUNNER_TEMP}/uv-publisher-requirements.txt"
          cat > "${requirements}" <<'EOF'
          uv==0.12.0 \
              --hash=sha256:cbff74f884846d794713670faf8abe10db3bd70c43b01e63223f74eb7d958689
          EOF
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --no-deps \
            --no-cache-dir \
            --requirement "${requirements}"
          uv_version="$(uv -V)"
          printf 'Installed publisher: %s\n' "${uv_version}"
          [[ "${uv_version}" == "uv 0.12.0" ]]

      - name: Publish with PyPI Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          uv publish \
            --trusted-publishing always \
            --publish-url https://upload.pypi.org/legacy/ \
            --check-url https://pypi.org/simple/ \
            --no-attestations \
            --no-cache \
            --no-config \
            --no-progress \
            dist/*

      - name: Verify published files by SHA-256
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python scripts/verify_pypi_artifacts.py remote
          --dist dist
          --version "${VERSION}"
          --summary "${RUNNER_TEMP}/pypi-published-summary.json"

      - name: Install from PyPI and verify the published package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/pypi-smoke"
          work="${RUNNER_TEMP}/pypi-smoke-work"
          python -m venv "${venv}"
          mkdir -p "${work}"
          installed=false
          for attempt in {1..12}; do
            if "${venv}/bin/python" -m pip install \
              --disable-pip-version-check \
              --no-cache-dir \
              --only-binary=:all: \
              "cocoapdf==${VERSION}"; then
              installed=true
              break
            fi
            sleep 5
          done
          [[ "${installed}" == "true" ]]
          [[ "$("${venv}/bin/cocoapdf" --version)" == "cocoapdf ${VERSION}" ]]
          cd "${work}"
          REPO_ROOT="${GITHUB_WORKSPACE}" VERSION="${VERSION}" "${venv}/bin/python" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path

          import cocoapdf
          from cocoapdf import convert_file

          version = os.environ["VERSION"]
          root = Path(os.environ["REPO_ROOT"])
          assert importlib.metadata.version("cocoapdf") == version
          assert cocoapdf.__version__ == version
          actual = convert_file(root / "examples/cases/tagged_semantics/input.pdf").markdown
          expected = (root / "examples/cases/tagged_semantics/full/output.md").read_text(
              encoding="utf-8"
          )
          assert actual == expected
          PY
