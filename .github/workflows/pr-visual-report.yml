name: PR visual trusted reporting

on:
  workflow_run:
    workflows: [PR visual validation]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    name: Publish visual artifact metadata
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out default-branch reporter only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.14"

      - name: Validate metadata and replace the PR-owned block
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python validation/pr_visual/report.py \
            --repository "${GITHUB_REPOSITORY}" \
            --event-json "${GITHUB_EVENT_PATH}"
