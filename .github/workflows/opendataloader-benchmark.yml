name: OpenDataLoader benchmark

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Candidate execution is delegated to an immutable, read-only worker. The
# default-branch workflow_run independently authenticates that worker SHA before
# accepting its bounded prediction artifact.
permissions:
  contents: read

concurrency:
  group: opendataloader-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    name: Convert pinned 200-PDF corpus
    permissions:
      contents: read
    # The full SHA is retained by the immutable odl-worker-v1.2 tag, including
    # after this caller is squash-merged.
    uses: sayantandey/CocoaPDF/.github/workflows/opendataloader-worker.yml@e0223382c52088631c2260f34840bb2b5a49bba6
    with:
      candidate_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      worker_sha: e0223382c52088631c2260f34840bb2b5a49bba6
