name: Capability demo Pages

on:
  push:
    branches: [main]
    paths:
      - examples/**
      - docs/assets/brand/images/social/cocoapdf-og-image-1200x630.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: capability-demo-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy rendered examples
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Prepare the immutable capability site
        shell: bash
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/cocoapdf-pages"
          mkdir -p "${site}"
          cp -a examples/. "${site}/"
          cp examples/review.html "${site}/index.html"
          cp docs/assets/brand/images/social/cocoapdf-og-image-1200x630.png "${site}/"
          touch "${site}/.nojekyll"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/cocoapdf-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
