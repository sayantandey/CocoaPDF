name: PR visual validation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Candidate code may generate the review corpus, but this workflow has no write
# authority. The default-branch workflow_run reporter publishes only validated
# artifact metadata and never downloads or executes this artifact.
permissions:
  contents: read

concurrency:
  group: pr-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate review corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the pull-request merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Generate inputs, CocoaPDF outputs, hashes, and review index
        env:
          PYTHONHASHSEED: "0"
          TZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          python validation/pr_visual/build.py \
            --output-dir "${RUNNER_TEMP}/cocoapdf-pr-visual" \
            --source-commit "${GITHUB_SHA}" \
            --head-commit "${{ github.event.pull_request.head.sha }}"

      - name: Upload the immutable review artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cocoapdf-pr-visual-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cocoapdf-pr-visual
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Publish the unprivileged job summary
        env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          BASE_REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## CocoaPDF PR visual validation"
            echo
            echo "[Download the three input PDFs and all Markdown/HTML/JSON outputs](${ARTIFACT_URL})"
            echo
            echo "Artifact SHA-256: \`${ARTIFACT_DIGEST}\`"
            echo
            echo "After downloading and unzipping, open \`review.html\` for side-by-side inspection."
            echo
            if [[ "${HEAD_REPOSITORY}" == "${BASE_REPOSITORY}" ]]; then
              echo "[Open this exact commit's rendered capability demo](https://rawcdn.githack.com/${HEAD_REPOSITORY}/${HEAD_SHA}/examples/review.html)"
            else
              echo "External HTML preview is intentionally omitted for fork pull requests; review the generated artifact instead."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
